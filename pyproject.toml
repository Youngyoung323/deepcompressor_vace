[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffsynth-deepcompressor"
version = "0.1.0"
description = "Unified environment for DiffSynth-Studio and DeepCompressor"
authors = []
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    # ---------- 共有依赖（取版本交集） ----------
    "torch>=2.7.0,<2.8.0",
    "torchvision",
    "transformers>=4.52.0,<=4.53.2",
    "accelerate<2.0.0",
    "datasets<4.0.0",
    "sentencepiece",
    "protobuf",
    "einops",
    "ftfy",

    # ---------- 来自 DiffSynth-Studio ----------
    "imageio[ffmpeg]",
    "safetensors",
    "modelscope",
    "pandas",
    "peft",

    # ---------- 来自 DeepCompressor ----------
    "diffusers>=0.33.0,<=0.34.0",
    "lm_eval>=0.4.8,<0.4.9",
    "omniconfig>=0.1.10,<0.2.0",
    "tqdm",
    "torchmetrics",
    "ninja",
    "jieba",
    "fuzzywuzzy",
    "rouge",
    "python-Levenshtein",
    "clean-fid",
    "dominate",
    "opencv-python",
    "timm",
    "rotary-embedding-torch",
    "bs4",
    "xformers",
    "clip",
    "image_reward @ git+https://github.com/THUDM/ImageReward.git@main",
]

[project.optional-dependencies]
dev = [
    "matplotlib",
    "ipython",
]

[tool.setuptools.packages.find]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C", "E", "F", "I", "W"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
